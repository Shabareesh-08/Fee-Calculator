<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b00">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fee Calc">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Fee Calculator</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #dbe4f0);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    input[readonly] {
      background: #f3f3f3;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff9f43, #ff6b00);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>ECS Fee Calculator</h2>

    <label>Claim Amount</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <label>Success Fee (%)</label>
    <input type="number" id="percent" value="15">

    <label>GST (%)</label>
    <input type="number" value="18" readonly>

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculate() {
      let amount = parseFloat(document.getElementById("amount").value);
      let percent = parseFloat(document.getElementById("percent").value);
      let gst = 18;

      if (!amount) return;

      let fee = amount * (percent / 100);
      let gstAmount = fee * (gst / 100);
      let total = fee + gstAmount;

      let feeHalf = fee / 2;
      let gstHalf = gstAmount / 2;
      let installment = total / 2;

      document.getElementById("result").innerHTML = `
        ${percent}% of ₹${amount.toFixed(2)} = ₹${fee.toFixed(2)} <br>
        GST (${gst}%) = ₹${gstAmount.toFixed(2)} <br><br>

        <b>Total = ₹${total.toFixed(2)}</b><br><br>

        <b>Installment 1</b><br>
        Charge = ₹${feeHalf.toFixed(2)} <br>
        GST = ₹${gstHalf.toFixed(2)} <br>
        Total = ₹${installment.toFixed(2)} <br><br>

        <b>Installment 2</b><br>
        Charge = ₹${feeHalf.toFixed(2)} <br>
        GST = ₹${gstHalf.toFixed(2)} <br>
        Total = ₹${installment.toFixed(2)}
      `;
    }
  </script>

</body>

</html>
