<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ▼ PWA REQUIRED TAGS ▼ -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f2240">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fee Calc">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- ▲ PWA REQUIRED TAGS ▲ -->

  <title>ECS Fee Calculator</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- ▼ SERVICE WORKER REGISTRATION ▼ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
  <!-- ▲ SERVICE WORKER REGISTRATION ▲ -->

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F0F4F4;
      --teal: #72BAB7;
      --teal-dark: #5A9996;
      --yellow: #E9BC48;
      --yellow-light: #FDF8E7;
      --surface: #ffffff;
      --surface2: #F7FAFA;
      --border: #D2DDDE;
      --text: #162020;
      --text-inv: #ffffff;
      --muted: #647575;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(114, 186, 183, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(233, 188, 72, 0.15) 0%, transparent 50%);
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .badge {
      display: inline-block;
      background: var(--yellow-light);
      border: 1px solid rgba(233, 188, 72, 0.3);
      color: #A67C1E;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 8px;
    }

    .card {
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(114, 186, 183, 0.15), 0 0 0 1px rgba(210, 221, 222, 0.5);
    }

    .card-body {
      padding: 28px 28px 24px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-label:first-child {
      margin-top: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .field input,
    .field select {
      height: 44px;
      padding: 0 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--surface2);
      transition: all 0.18s ease;
      outline: none;
      width: 100%;
    }

    .field input:hover,
    .field select:hover {
      border-color: #A0BDBB;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--teal);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(114, 186, 183, 0.2);
    }

    .field input[readonly] {
      color: var(--muted);
      cursor: not-allowed;
      background: #eef0f5;
    }

    .installment-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .installment-row select {
      height: 44px;
      padding: 0 10px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--surface2);
      transition: all 0.18s ease;
      outline: none;
      white-space: nowrap;
    }

    .installment-row select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(114, 186, 183, 0.2);
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn-calculate {
      width: 100%;
      height: 48px;
      background: var(--teal);
      color: var(--text-inv);
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-calculate::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--teal-dark), var(--teal));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-calculate:hover::before {
      opacity: 1;
    }

    .btn-calculate:active {
      transform: scale(0.98);
    }

    .btn-calculate span {
      position: relative;
      z-index: 1;
    }

    .results {
      background: var(--surface2);
      padding: 24px 28px;
      border-top: 1px solid var(--border);
    }

    .results-hidden {
      display: none;
    }

    .total-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .total-strip .cell {
      background: var(--surface);
      padding: 14px 16px;
      text-align: center;
    }

    .total-strip .cell .label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .total-strip .cell .value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .total-strip .cell.highlight {
      background: var(--yellow-light);
    }

    .total-strip .cell.highlight .label {
      color: #A67C1E;
    }

    .total-strip .cell.highlight .value {
      color: #A67C1E;
    }

    .inst-grid {
      display: grid;
      gap: 10px;
    }

    .inst-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr 1fr 1fr;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }

    .inst-card:hover {
      background: var(--surface2);
    }

    .inst-num {
      width: 32px;
      height: 32px;
      background: var(--teal);
      color: var(--text-inv);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .inst-col .col-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
    }

    .inst-col .col-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .inst-col.total-col .col-value {
      color: var(--text);
      font-weight: 600;
    }

    .warning {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(220, 60, 60, 0.05);
      border: 1px solid rgba(220, 60, 60, 0.2);
      color: #D33D3D;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="header">
      <div class="badge">ECS Legal Services</div>
      <h1>Fee Calculator</h1>
      <p>Calculate success fees, GST & installment breakdowns</p>
    </div>

    <div class="card">
      <div class="card-body">

        <div class="section-label">Claim Details</div>
        <div class="grid-2">
          <div class="field" style="grid-column: span 2">
            <label>Claim Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 500000">
          </div>
          <div class="field">
            <label>Success Fee (%)</label>
            <input type="number" id="percent" value="15" min="0" max="100">
          </div>
          <div class="field">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label for="serviceAmount">Service Amount (₹)</label>
              <label for="inclGst"
                style="display: flex; align-items: center; gap: 4px; font-weight: normal; cursor: pointer; font-size: 11px;">
                <input type="checkbox" id="inclGst" style="width: 13px; height: 13px; margin: 0; padding: 0;"> Incl. GST
              </label>
            </div>
            <input type="number" id="serviceAmount" placeholder="e.g. 75000">
          </div>
          <div class="field" style="grid-column: span 2">
            <label>GST (%)</label>
            <input type="number" value="18" readonly>
          </div>
        </div>

        <div class="section-label">Installment Setup</div>
        <div class="grid-2">
          <div class="field">
            <label>No. of Installments</label>
            <select id="installments">
              <option value="2">2 Installments</option>
              <option value="3">3 Installments</option>
            </select>
          </div>
          <div class="field">
            <label>First Installment</label>
            <div class="installment-row">
              <input type="number" id="firstValue" placeholder="Optional">
              <select id="mode">
                <option value="amount">₹</option>
                <option value="percent">%</option>
              </select>
            </div>
          </div>
        </div>
        <p class="hint">Leave First Installment blank to split equally.</p>

      </div>

      <!-- Results -->
      <div class="results results-hidden" id="results">
        <div style="font-size: 16px; font-weight: 600; color: var(--teal-dark); margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Calculated Fee Breakdown
        </div>
        <div class="total-strip" id="total-strip"></div>
        <div class="inst-grid" id="inst-grid"></div>
        <div class="copy-section" id="copy-section" style="margin-top: 24px;">
          <div class="section-label" style="margin-top: 0; color: var(--teal-dark); display: flex; justify-content: space-between; align-items: center;">
            <span>Quick Copy (Fee Column)</span>
            <button onclick="const text = Array.from(document.getElementById('copy-box').children).map(el => el.firstElementChild.innerText).join('\n'); navigator.clipboard.writeText(text); const btn = this; const old = btn.innerHTML; btn.innerHTML = '✅ Copied!'; setTimeout(() => btn.innerHTML = old, 1500);" style="background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 10px; cursor: pointer; color: var(--teal-dark); display: flex; align-items: center; gap: 6px; font-weight: 600; text-transform: none; letter-spacing: normal; transition: background 0.15s;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='var(--surface)'" title="Copy All">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy All
            </button>
          </div>
          <div id="copy-box"
            style="background: var(--surface); border: 1px dashed var(--teal); padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text); font-family: Calibri, sans-serif;">
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let lastEditedFeeField = 'percent';

    ['amount', 'firstValue', 'mode', 'installments'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
      document.getElementById(id).addEventListener('change', calculate);
    });

    ['percent', 'serviceAmount'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', (e) => {
          lastEditedFeeField = id;
          calculate();
        });
        el.addEventListener('change', calculate);
      }
    });

    const inclGstEl = document.getElementById('inclGst');
    if (inclGstEl) {
      inclGstEl.addEventListener('change', calculate);
    }

    function fmt(n) {
      return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function split(val) {
      let charge = val / 1.18;
      let gst = val - charge;
      return { charge, gst };
    }

    function calculate() {
      const amount = parseFloat(document.getElementById('amount').value);
      let percent = parseFloat(document.getElementById('percent').value);
      let serviceAmount = parseFloat(document.getElementById('serviceAmount').value);
      const installmentCount = parseInt(document.getElementById('installments').value);
      let firstValue = parseFloat(document.getElementById('firstValue').value);
      const mode = document.getElementById('mode').value;
      const inclGst = document.getElementById('inclGst') ? document.getElementById('inclGst').checked : false;

      const resultsEl = document.getElementById('results');
      const totalStripEl = document.getElementById('total-strip');
      const instGridEl = document.getElementById('inst-grid');

      if (isNaN(amount) || amount <= 0) {
        resultsEl.classList.add('results-hidden');
        return;
      }

      let fee = 0;

      if (lastEditedFeeField === 'percent' && !isNaN(percent)) {
        fee = amount * (percent / 100);
        serviceAmount = inclGst ? (fee * 1.18) : fee;
        document.getElementById('serviceAmount').value = Number.isInteger(serviceAmount) ? serviceAmount : serviceAmount.toFixed(2);
      } else if (lastEditedFeeField === 'serviceAmount' && !isNaN(serviceAmount)) {
        fee = inclGst ? (serviceAmount / 1.18) : serviceAmount;
        percent = (fee / amount) * 100;
        document.getElementById('percent').value = Number.isInteger(percent) ? percent : percent.toFixed(2);
      } else {
        resultsEl.classList.add('results-hidden');
        return;
      }

      const gstAmount = fee * 0.18;
      const total = fee + gstAmount;

      let i1 = 0, i2 = 0, i3 = 0;

      if (isNaN(firstValue) || firstValue <= 0) {
        if (installmentCount === 2) {
          i1 = total / 2; i2 = total / 2;
        } else {
          i1 = total / 3; i2 = total / 3; i3 = total / 3;
        }
      } else {
        if (mode === 'percent') firstValue = total * (firstValue / 100);

        if (firstValue > total) {
          resultsEl.classList.remove('results-hidden');
          instGridEl.innerHTML = '<div class="warning">⚠ First installment exceeds the total fee.</div>';
          totalStripEl.innerHTML = '';
          return;
        }

        i1 = firstValue;
        if (installmentCount === 2) {
          i2 = total - i1;
        } else {
          let half = total / 2;
          i2 = half - i1;
          if (i2 < 0) i2 = 0;
          i3 = total - i1 - i2;
        }
      }

      totalStripEl.innerHTML = `
        <div class="cell">
          <div class="label">Base Fee</div>
          <div class="value">${fmt(fee)}</div>
        </div>
        <div class="cell">
          <div class="label">GST 18%</div>
          <div class="value">${fmt(gstAmount)}</div>
        </div>
        <div class="cell highlight">
          <div class="label">Total</div>
          <div class="value">${fmt(total)}</div>
        </div>
      `;

      const installments = [i1, i2];
      if (installmentCount === 3) installments.push(i3);

      let copyTextArr = [];

      instGridEl.innerHTML = installments.map((val, i) => {
        const s = split(val);
        const chargeFmt = s.charge.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const gstFmt = s.gst.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const valFmt = val.toLocaleString('en-IN', { maximumFractionDigits: 2 });

        copyTextArr.push(`Rs. ${chargeFmt} + Rs. ${gstFmt} (GST) = Rs. ${valFmt}/-`);

        return `
          <div class="inst-card">
            <div class="inst-num">${i + 1}</div>
            <div class="inst-col">
              <div class="col-label">Charge</div>
              <div class="col-value">${fmt(s.charge)}</div>
            </div>
            <div class="inst-col">
              <div class="col-label">GST</div>
              <div class="col-value">${fmt(s.gst)}</div>
            </div>
            <div class="inst-col total-col">
              <div class="col-label">Total</div>
              <div class="col-value">${fmt(val)}</div>
            </div>
          </div>
        `;
      }).join('');

      // Add Total row for copy box
      const totalChargeFmt = fee.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const totalGstFmt = gstAmount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const finalTotalFmt = total.toLocaleString('en-IN', { maximumFractionDigits: 2 });
      copyTextArr.push(`Rs. ${totalChargeFmt} + Rs. ${totalGstFmt} (GST) = Rs. ${finalTotalFmt}/-`);

      document.getElementById('copy-box').innerHTML = copyTextArr.map(text =>
        `<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); transition: background 0.15s;" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">
          <div style="user-select: all; cursor: text; padding-right: 12px;">${text}</div>
          <button onclick="navigator.clipboard.writeText('${text}'); const btn = this; const old = btn.innerHTML; btn.innerHTML = '✅'; setTimeout(() => btn.innerHTML = old, 1500);" style="background: transparent; border: none; cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--teal); flex-shrink: 0;" title="Copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>`
      ).join('');
      document.getElementById('copy-box').lastElementChild.style.borderBottom = 'none';

      resultsEl.classList.remove('results-hidden');
    }
  </script>
</body>

</html>
